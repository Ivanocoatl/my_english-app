    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-label { font-family: 'Inter', sans-serif; }
        
        /* Animación para el micrófono cuando está escuchando */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(0, 87, 189, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(0, 87, 189, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(0, 87, 189, 0); }
        }
        .listening-active {
            animation: pulse-ring 2s infinite;
            background: linear-gradient(to bottom right, #b31b25, #fb5151) !important;
        }
        
        /* Animación para subir de nivel */
        @keyframes level-up {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; color: #f8a010; }
            100% { transform: scale(1); opacity: 1; }
        }
        .level-up-anim {
            animation: level-up 1s ease-in-out;
        }

        /* Animación para el modal */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pop-in {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-bg-anim { animation: fade-in 0.2s ease-out forwards; }
        .modal-content-anim { animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

</head>

    <!-- Barra de Navegación Inferior (Móvil) -->

    <!-- Modal Personalizado para Botones de Navegación -->

    <!-- Lógica de la Aplicación -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- 1. LÓGICA DE DATOS (JSON EXTERNO O RESPALDO) ---
        let courseDataJSON = null;

        // Datos de respaldo por si el archivo 'datos.json' no existe aún
        const fallbackData = {
            "niveles": [
                {
                    "id": "A1",
                    "nombre": "Nivel A1",
                    "frases": [
                        { "en": "Hello, how are you?", "es": "Hola, ¿cómo estás?" },
                        { "en": "My name is John.", "es": "Mi nombre es John." },
                        { "en": "Nice to meet you.", "es": "Gusto en conocerte." },
                        { "en": "I am learning English.", "es": "Estoy aprendiendo inglés." },
                        { "en": "Where is the bathroom?", "es": "¿Dónde está el baño?" }
                    ]
                },
                {
                    "id": "A2",
                    "nombre": "Nivel A2",
                    "frases": [
                        { "en": "I would like to order a coffee, please.", "es": "Me gustaría pedir un café, por favor." },
                        { "en": "What time does the train leave?", "es": "¿A qué hora sale el tren?" },
                        { "en": "Could you repeat that slower?", "es": "¿Podrías repetir eso más despacio?" },
                        { "en": "I went to the store yesterday.", "es": "Fui a la tienda ayer." },
                        { "en": "Do you accept credit cards?", "es": "¿Aceptan tarjetas de crédito?" }
                    ]
                }
            ]
        };

        // Función para intentar cargar el JSON de un archivo externo
        async function loadCourseData() {
            try {
                // Aquí intenta buscar un archivo llamado "datos.json" en tu repositorio
                const response = await fetch('datos.json');
                if (!response.ok) throw new Error("No se pudo cargar el archivo");
                
                courseDataJSON = await response.json();
                console.log("Datos cargados exitosamente desde datos.json");
            } catch (error) {
                console.log("No se encontró 'datos.json'. Usando datos de respaldo integrados.");
                courseDataJSON = fallbackData;
            }
            
            // Ocultar pantalla de carga y mostrar el contenido
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('practice-card').classList.remove('hidden');
            document.getElementById('mic-container').classList.remove('hidden');
            
            // Un pequeño retraso para la animación de entrada
            setTimeout(() => {
                document.getElementById('main-content').style.opacity = '1';
                document.getElementById('practice-card').style.opacity = '1';
            }, 50);

            iniciarApp();
        }

        // --- 2. ESTADO Y VARIABLES DE LA APP ---
        let currentLevelIndex = 0; 
        let currentPhraseIndex = 0;
        let isTranslationVisible = false;
        let totalScore = 0;

        // Referencias al DOM
        const phraseText = document.getElementById('phrase-text');
        const translationText = document.getElementById('translation-text');
        const toggleTransBtn = document.getElementById('toggle-translation-btn');
        const transBtnText = document.getElementById('translation-btn-text');
        const transIcon = document.getElementById('translation-icon');
        
        const listenBtn = document.getElementById('listen-btn');
        const speakBtn = document.getElementById('speak-btn');
        const micIcon = document.getElementById('mic-icon');
        const speakHint = document.getElementById('speak-hint');
        
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackScore = document.getElementById('feedback-score');
        const userSpokenText = document.getElementById('user-spoken-text');
        const nextBtn = document.getElementById('next-btn');

        const currentLevelText = document.getElementById('current-level-text');
        const levelBadge = document.getElementById('level-badge');
        const totalScoreDisplay = document.getElementById('total-score');

        // --- 3. LÓGICA DE BOTONES DE NAVEGACIÓN (MODAL) ---
        const navButtons = document.querySelectorAll('.nav-btn');
        const infoModal = document.getElementById('info-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalSectionName = document.getElementById('modal-section-name');

        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const sectionName = btn.getAttribute('data-nav');
                modalSectionName.innerText = sectionName;
                infoModal.classList.remove('hidden');
            });
        });

        closeModalBtn.addEventListener('click', () => {
            infoModal.classList.add('hidden');
        });

        // --- 4. FUNCIONES PRINCIPALES DE LA LECCIÓN ---
        function getCurrentPhrases() {
            return courseDataJSON.niveles[currentLevelIndex].frases;
        }

        function loadPhrase() {
            const phrases = getCurrentPhrases();

            // Verificar si el nivel ha terminado
            if(currentPhraseIndex >= phrases.length) {
                if (currentLevelIndex < courseDataJSON.niveles.length - 1) {
                    levelUp();
                    return;
                } else {
                    // Curso terminado completamente
                    phraseText.innerHTML = "¡Curso Completado! 🏆";
                    translationText.classList.add('hidden');
                    toggleTransBtn.classList.add('hidden');
                    speakBtn.classList.add('hidden');
                    listenBtn.classList.add('hidden');
                    feedbackArea.classList.add('hidden');
                    return;
                }
            }

            const current = phrases[currentPhraseIndex];
            phraseText.innerText = current.en;
            translationText.innerText = current.es;
            
            isTranslationVisible = false;
            updateTranslationUI();
            
            feedbackArea.classList.add('hidden');
            nextBtn.classList.add('hidden');
            
            // Progreso
            const progress = (currentPhraseIndex / phrases.length) * 100;
            progressFill.style.width = `${progress}%`;
            progressText.innerText = `${currentPhraseIndex}/${phrases.length} completadas (${courseDataJSON.niveles[currentLevelIndex].id})`;
        }

        function levelUp() {
            currentLevelIndex++;
            currentPhraseIndex = 0; 
            
            const newLevelName = courseDataJSON.niveles[currentLevelIndex].nombre;
            currentLevelText.innerText = newLevelName;
            
            levelBadge.classList.add('level-up-anim');
            setTimeout(() => { levelBadge.classList.remove('level-up-anim'); }, 1000);

            loadPhrase();
        }

        function updateTranslationUI() {
            if (isTranslationVisible) {
                translationText.classList.remove('hidden');
                transBtnText.innerText = "Ocultar traducción";
                transIcon.innerText = "visibility_off";
            } else {
                translationText.classList.add('hidden');
                transBtnText.innerText = "Mostrar traducción";
                transIcon.innerText = "visibility";
            }
        }

        toggleTransBtn.addEventListener('click', () => {
            isTranslationVisible = !isTranslationVisible;
            updateTranslationUI();
        });

        // --- 5. SÍNTESIS DE VOZ (Texto a Voz - US English STRICT) ---
        let englishVoice = null;
        
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Buscar voz estrictamente en inglés de EE.UU.
            englishVoice = voices.find(v => v.lang === 'en-US');
            if(!englishVoice) englishVoice = voices.find(v => v.lang.startsWith('en'));
        }
        
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); 

        listenBtn.addEventListener('click', () => {
            const phrases = getCurrentPhrases();
            const utterance = new SpeechSynthesisUtterance(phrases[currentPhraseIndex].en);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            if (englishVoice) utterance.voice = englishVoice;
            window.speechSynthesis.speak(utterance);
        });

        function calculateSimilarity(target, spoken) {
            const normalize = (str) => str.toLowerCase().replace(/[.,!?'\s]/g, '').trim();
            const t = normalize(target);
            const s = normalize(spoken);
            
            if (t === s) return 100;
            if (t.length === 0 || s.length === 0) return 0;
            
            let matches = 0;
            let j = 0;
            for(let i = 0; i < s.length && j < t.length; i++) {
                if(s[i] === t[j]) { matches++; j++; }
            }
            
            const ratio = (matches / t.length) * 100;
            return Math.min(100, Math.round(ratio));
        }

        // --- 6. RECONOCIMIENTO DE VOZ (Voz a Texto - US English STRICT) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US'; // Escuchar en inglés americano

            recognition.onstart = () => {
                speakBtn.classList.add('listening-active');
                micIcon.innerText = "hearing";
                speakHint.innerText = "Escuchando...";
                speakHint.style.opacity = "1";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userSpokenText.innerText = `"${transcript}"`;
                
                const currentPhrases = getCurrentPhrases();
                const targetPhrase = currentPhrases[currentPhraseIndex].en;
                const score = calculateSimilarity(targetPhrase, transcript);
                
                feedbackArea.classList.remove('hidden');
                feedbackScore.innerText = `Precisión: ${score}%`;
                feedbackArea.className = "w-full max-w-md mx-auto rounded-2xl p-4 flex flex-col items-center gap-4 shadow-lg border transition-all duration-300";
                
                if (score > 75) {
                    feedbackArea.classList.add('bg-secondary-container', 'text-on-secondary-container', 'border-secondary-dim/30');
                    feedbackIcon.innerText = "check_circle";
                    feedbackIcon.classList.replace('text-error', 'text-secondary-dim');
                    feedbackTitle.innerText = "¡Excelente pronunciación!";
                    nextBtn.classList.remove('hidden'); 
                    
                    totalScore += score;
                    totalScoreDisplay.innerText = `${totalScore} pts`;
                } else if (score > 40) {
                    feedbackArea.classList.add('bg-surface-container-highest', 'text-on-surface', 'border-outline-variant');
                    feedbackIcon.innerText = "model_training";
                    feedbackIcon.classList.replace('text-error', 'text-tertiary');
                    feedbackTitle.innerText = "Casi lo logras, inténtalo de nuevo";
                    nextBtn.classList.add('hidden'); 
                } else {
                    feedbackArea.classList.add('bg-error-container/20', 'text-error', 'border-error/30');
                    feedbackIcon.innerText = "error";
                    feedbackTitle.innerText = "Necesita mejora";
                    nextBtn.classList.add('hidden'); 
                }
            };

            recognition.onerror = (event) => {
                speakBtn.classList.remove('listening-active');
                micIcon.innerText = "mic";
                speakHint.style.opacity = "";
                speakHint.innerText = "Toca para hablar";
            };

            recognition.onend = () => {
                speakBtn.classList.remove('listening-active');
                micIcon.innerText = "mic";
                speakHint.style.opacity = "";
                speakHint.innerText = "Toca para hablar";
            };

            speakBtn.addEventListener('click', () => {
                try { recognition.start(); } catch (e) {}
            });
            
        } else {
            speakBtn.addEventListener('click', () => {
                // Si el navegador no soporta Speech Recognition, mostramos el modal en vez de un alert feo
                modalSectionName.innerText = "Navegador no soportado";
                document.getElementById('modal-desc').innerText = "Tu navegador no soporta reconocimiento de voz nativo. Usa Chrome o Edge.";
                infoModal.classList.remove('hidden');
            });
        }

        nextBtn.addEventListener('click', () => {
            currentPhraseIndex++;
            loadPhrase();
        });

        // Inicia el proceso de carga
        function iniciarApp() {
            currentLevelText.innerText = courseDataJSON.niveles[0].nombre;
            loadPhrase();
        }

        loadCourseData();
    });
    </script>
</body>
</html>
